# Toont de status van de builds in App Store Connect en TestFlight.
# Starten: Actions > Build-status > Run workflow. Wijzigt niets.
name: Build-status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Python-pakketten installeren
        run: pip install --quiet pyjwt cryptography requests

      - name: Status opvragen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: python
        run: |
          import os, time, jwt, requests

          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              os.environ["ASC_KEY_P8"], algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": f"Bearer {token}"}
          API = "https://api.appstoreconnect.apple.com/v1"

          def get(path, **params):
              r = requests.get(API + path, headers=H, params=params, timeout=30)
              if r.status_code >= 400:
                  print(f"FOUT {r.status_code} bij {path}: {r.text[:500]}")
                  r.raise_for_status()
              return r.json()

          apps = get("/apps", **{"filter[bundleId]": "nl.paulquist.zerophone"})["data"]
          if not apps:
              raise SystemExit("App nl.paulquist.zerophone niet gevonden")
          app_id = apps[0]["id"]
          print(f"App: {apps[0]['attributes']['name']} ({app_id})\n")

          builds = get("/builds", **{"filter[app]": app_id, "sort": "-uploadedDate",
                                     "limit": 10, "include": "buildBetaDetail"})
          details = {d["id"]: d["attributes"] for d in builds.get("included", [])
                     if d["type"] == "buildBetaDetails"}
          if not builds["data"]:
              print("Nog geen builds zichtbaar in App Store Connect.")
          for b in builds["data"]:
              a = b["attributes"]
              rel = b.get("relationships", {}).get("buildBetaDetail", {}).get("data") or {}
              d = details.get(rel.get("id"), {})
              print(f"Build {a['version']}: verwerking={a['processingState']}, "
                    f"geüpload={a['uploadedDate']}, verloopt={a.get('expirationDate')}, "
                    f"exportcompliance-vraag={a.get('usesNonExemptEncryption')}, "
                    f"intern={d.get('internalBuildState')}, extern={d.get('externalBuildState')}")

          groups = get(f"/apps/{app_id}/betaGroups")["data"]
          print(f"\nTestgroepen: {len(groups)}")
          for g in groups:
              ga = g["attributes"]
              testers = get(f"/betaGroups/{g['id']}/betaTesters")["data"]
              print(f"- {ga['name']} (intern={ga.get('isInternalGroup')}), testers: "
                    + ", ".join(t["attributes"].get("email") or "?" for t in testers))
