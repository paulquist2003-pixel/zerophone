# Compileertest: bouwt Zerophone zonder ondertekening op een Mac van GitHub.
# Draait alleen als de app-code of het projectbestand verandert (niet bij
# wijzigingen in andere workflows of documentatie), en handmatig.
# Voor de echte TestFlight-build: zie testflight.yml.
name: Build IPA

on:
  push:
    branches: [main]
    paths:
      - "Zerophone/**"
      - "project.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-versie tonen
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: XcodeGen installeren
        run: brew install xcodegen

      - name: Xcode-project genereren
        run: xcodegen

      - name: Bouwen (zonder ondertekening)
        run: |
          xcodebuild -project Zerophone.xcodeproj -target Zerophone \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA maken
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Zerophone.app Payload/
          zip -qry Zerophone-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Zerophone-ipa
          path: Zerophone-unsigned.ipa
