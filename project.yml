name: Zerophone
options:
  bundleIdPrefix: nl.paulquist
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Zerophone:
    type: application
    platform: iOS
    sources:
      - path: Zerophone
        excludes:
          - "Resources/**"
      - path: Zerophone/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.paulquist.zerophone
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zerophone
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Voor het maken van foto's en video's in Instagram."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Voor spraakberichten en video's in Instagram."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Voor het delen van foto's in Instagram."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Zerophone:
    build:
      targets:
        Zerophone: all
    run:
      config: Debug
    archive:
      config: Release
